# T13 deploy slice 1 - Nginx edge contract (single public entry point).
# Mounted read-only by the edge service in deploy/compose.yml.
# Non-root: listens on 8080 only. TLS is NOT configured here; see the commented
# placeholder at the bottom and deploy/README.md ("Certificates") - key material
# must never be committed and 443 requires an explicitly authorized target.

server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # NOTE: CSP below has not been browser-validated yet; verify before any external gate.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    # Request size limit + timeouts for both static and proxied traffic.
    client_max_body_size 2m;
    client_body_timeout 15s;
    send_timeout 30s;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: backend controllers declare @RequestMapping("/api/v1/...")
    # themselves, so the FULL URI including the /api prefix must reach upstream.
    # (No trailing slash on proxy_pass => no prefix rewriting.)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Do not leak upstream/internal details to clients.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_intercept_errors off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

