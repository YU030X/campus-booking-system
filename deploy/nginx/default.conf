#   1) explicit user authorization of host/domain/DNS,
#   2) certificate/key material provided by mounts (never committed),
#   3) an approved renewal runbook reference in .env/README.
# A 443 server block with `ssl_certificate /run/secrets/tls.crt;` style mounts
# may only be added after that authorization exists. Port 443 publishing is an
# external-gate decision owned by tasks.md 8.1-8.2.
